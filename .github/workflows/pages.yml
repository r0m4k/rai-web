name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.html from src/
        run: python build_site.py
      - name: Build version 2 (v2/index.html from v2/src/)
        run: python v2/build_site.py
      - name: Collect public files (sources and build script stay out of the site)
        run: |
          mkdir _site
          cp -R index.html events.html blog.html site.css site.js assets .nojekyll _site/
          mkdir _site/v2
          cp -R v2/index.html v2/events.html v2/blog.html v2/site.css v2/site.js v2/assets _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
